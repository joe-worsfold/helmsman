# Generated by .helmsman/tools/ci/emit.sh. Do not edit by hand.
name: helmsman

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'run' }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eslint: ${{ steps.paths.outputs.eslint }}
      knip: ${{ steps.paths.outputs.knip }}
      ts: ${{ steps.paths.outputs.ts }}
      rust: ${{ steps.paths.outputs.rust }}
      python: ${{ steps.paths.outputs.python }}
      schema: ${{ steps.paths.outputs.schema }}
      web: ${{ steps.paths.outputs.web }}
      api: ${{ steps.paths.outputs.api }}
      docs: ${{ steps.paths.outputs.docs }}
      setup: ${{ steps.paths.outputs.setup }}
      harness: ${{ steps.paths.outputs.harness }}
      workflows: ${{ steps.paths.outputs.workflows }}
      audit: ${{ steps.paths.outputs.audit }}
      guard: ${{ steps.paths.outputs.guard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - id: paths
        env:
          HELMSMAN_CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm --config.verify-deps-before-run=false ci:paths

  typecheck-tsc:
    name: typecheck (tsc)
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited' && (needs.changes.outputs.ts == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck

  test-harness:
    name: test (harness)
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited' && (needs.changes.outputs.harness == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: test
        env:
          HELMSMAN_FILTER: harness
        run: pnpm test

  audit:
    name: audit
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited' && (needs.changes.outputs.audit == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: audit:all
        run: pnpm audit:all

  setup:
    name: setup
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited' && (needs.changes.outputs.setup == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: setup:check
        run: pnpm --config.verify-deps-before-run=false setup:check

  diff-guard:
    name: diff guard
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited' && (needs.changes.outputs.guard == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: diff:guard
        env:
          HELMSMAN_DIFF_RANGE: "${{ github.event_name == 'pull_request' && format('{0}...HEAD', github.event.pull_request.base.sha) || 'HEAD~1...HEAD' }}"
        run: pnpm --config.verify-deps-before-run=false diff:guard
      - name: plain:language
        env:
          HELMSMAN_DIFF_RANGE: "${{ github.event_name == 'pull_request' && format('{0}...HEAD', github.event.pull_request.base.sha) || 'HEAD~1...HEAD' }}"
        run: pnpm --config.verify-deps-before-run=false plain:language

  eslint-package:
    name: eslint-package
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited' && (needs.changes.outputs.eslint == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: .helmsman/tools/eslint/pnpm-lock.yaml
      - name: Install
        working-directory: .helmsman/tools/eslint
        run: pnpm install --frozen-lockfile
      - name: eslint:package
        run: pnpm eslint:package

  knip-package:
    name: knip-package
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited' && (needs.changes.outputs.knip == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: .helmsman/tools/knip/pnpm-lock.yaml
      - name: Install
        working-directory: .helmsman/tools/knip
        run: pnpm install --frozen-lockfile
      - name: knip:package
        run: pnpm knip:package

  lint-actionlint:
    name: lint (actionlint)
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited' && (needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: lint:actions
        env:
          ACTIONLINT_SHA: 914e7df21a07ef503a81201c76d2b11c789d3fca
          ACTIONLINT_VERSION: "1.7.12"
        run: pnpm --config.verify-deps-before-run=false lint:actions

  ci-ok:
    name: ci-ok
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event.action != 'edited'
    needs:
      - changes
      - typecheck-tsc
      - test-harness
      - audit
      - setup
      - diff-guard
      - eslint-package
      - knip-package
      - lint-actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: ci:ok
        env:
          HELMSMAN_CI_RESULTS: >-
            changes=${{ needs.changes.result }}
            typecheck-tsc=${{ needs.typecheck-tsc.result }}
            test-harness=${{ needs.test-harness.result }}
            audit=${{ needs.audit.result }}
            setup=${{ needs.setup.result }}
            diff-guard=${{ needs.diff-guard.result }}
            eslint-package=${{ needs.eslint-package.result }}
            knip-package=${{ needs.knip-package.result }}
            lint-actionlint=${{ needs.lint-actionlint.result }}
        run: pnpm --config.verify-deps-before-run=false ci:ok
      - name: review:current
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --config.verify-deps-before-run=false review:current
