# Copy into Cargo.toml only when [workspace.lints] and [lints] are both absent.
# Do not paste this over a table that is already there.
# Each member sets `lints.workspace = true`.
#
# rust-version = "1.85" and edition = "2024" belong on the package,
# or on [workspace.package]. They are not lint levels.
#
# pedantic is warn, on purpose. priority = -1 lets the named denies win.
# Nursery is not in this table.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
