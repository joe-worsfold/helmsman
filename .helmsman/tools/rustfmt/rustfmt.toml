# Helmsman rustfmt gate.
# Copy to the crate root only when rustfmt.toml and .rustfmt.toml are absent.
# Do not replace a file that is already there.
#
# Stable options only. imports_granularity and group_imports need nightly.
# edition 2024 needs rustfmt from Rust 1.85 or newer. cargo fmt also reads
# the edition from Cargo.toml. Set that to 2024 when the key is absent.

edition = "2024"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
